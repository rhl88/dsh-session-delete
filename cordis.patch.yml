# Session-delete bundle patch: one dual-face row. The node half registers the
# delete route on the composition's webServer; the browser half (declared via
# the package manifest's dsh.client) adds the sidebar session-menu entry.
- insert:
    - id: session-delete
      name: 'dsh-session-remove'
      config:
        # Milliseconds of grace for a live session to release its persistence
        # write handles before the physical log is removed. A session held by
        # another surface is removed anyway (with a resurrection check), so
        # this only decides how long a clean, unforced release gets.
        timeoutMs: 8000
        # Override only for non-default deployments; defaults resolve through
        # $DSH_HOME ('sessions' and 'storages' beneath the harness home).
        # sessionsRoot: ~
        # storagesRoot: ~
